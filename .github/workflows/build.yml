name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Extract Project Zip
        run: |
          sudo apt-get install -y unzip
          find . -maxdepth 1 -name "*.zip" -exec unzip -o {} +

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Dependencies & Build Web Project
        run: |
          npm install --legacy-peer-deps
          npm install --save --legacy-peer-deps @capacitor/core @capacitor/cli @capacitor/android
          npm run build

      - name: Configure and Sync Android Platform
        run: |
          if [ ! -f "capacitor.config.ts" ] && [ ! -f "capacitor.config.json" ]; then
            npx cap init "Chaikhaneh Bahman" "com.bahman.chaikhaneh" --web-dir dist
          fi
          npx cap add android || true
          npx cap sync android

      - name: Build Android Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Chaikhaneh-Bahman-v1.0-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
