name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Extract Project Zip
        run: |
          sudo apt-get install -y unzip imagemagick
          find . -maxdepth 1 -name "*.zip" -exec unzip -o {} +

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Dependencies & Build Web Project
        run: |
          npm install --legacy-peer-deps
          npm install --save --legacy-peer-deps @capacitor/core@^6.0.0 @capacitor/cli@^6.0.0 @capacitor/android@^6.0.0
          npm run build

      - name: Configure Capacitor & Add Android Platform
        run: |
          cat << 'EOF' > capacitor.config.json
          {
            "appId": "com.chaikhaneh.bahman",
            "appName": "چایخانه عمو بهمن",
            "webDir": "dist",
            "bundledWebRuntime": false,
            "server": {
              "androidScheme": "https"
            }
          }
          EOF
          rm -rf android
          ./node_modules/.bin/cap add android
          ./node_modules/.bin/cap sync android

      - name: Set Persian App Name & Android Strings
        run: |
          cat << 'EOF' > android/app/src/main/res/values/strings.xml
          <?xml version='1.0' encoding='utf-8'?>
          <resources>
              <string name="app_name">چایخانه عمو بهمن</string>
              <string name="title_activity_main">چایخانه عمو بهمن</string>
              <string name="package_name">com.chaikhaneh.bahman</string>
              <string name="custom_url_scheme">com.chaikhaneh.bahman</string>
          </resources>
          EOF

      - name: Clean & Secure AndroidManifest.xml (Fix Play Protect)
        run: |
          cat << 'EOF' > android/app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <application
                  android:allowBackup="true"
                  android:icon="@mipmap/ic_launcher"
                  android:label="@string/app_name"
                  android:roundIcon="@mipmap/ic_launcher_round"
                  android:supportsRtl="true"
                  android:usesCleartextTraffic="false"
                  android:theme="@style/AppTheme">

                  <activity
                      android:configChanges="orientation|keyboardHidden|keyboard|screenSize|locale|smallestScreenSize|screenLayout|uiMode"
                      android:name=".MainActivity"
                      android:label="@string/title_activity_main"
                      android:theme="@style/AppTheme.NoActionBarLaunch"
                      android:launchMode="singleTask"
                      android:exported="true">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>

                  </activity>

                  <provider
                      android:name="androidx.core.content.FileProvider"
                      android:authorities="${applicationId}.fileprovider"
                      android:exported="false"
                      android:grantUriPermissions="true">
                      <meta-data
                          android:name="android.support.FILE_PROVIDER_PATHS"
                          android:resource="@xml/file_paths" />
                  </provider>
              </application>

              <!-- Only standard network permission -->
              <uses-permission android:name="android.permission.INTERNET" />
          </manifest>
          EOF

      - name: Apply Custom Game Icon & Styling
        run: |
          ICON_FILE=$(find . -maxdepth 2 -name "icon.png" -o -name "icon.jpg" -o -name "icon.jpeg" -o -name "pwa-512x512.png" 2>/dev/null | head -n 1 || true)
          if [ -z "$ICON_FILE" ]; then
            echo "Creating fallback icon..."
            convert -size 512x512 xc:'#0D3B3F' \
              -fill '#D4AF37' -draw "circle 256,256 256,400" \
              -fill '#7A1C1C' -draw "circle 256,256 256,380" \
              /tmp/fallback_icon.png
            ICON_FILE="/tmp/fallback_icon.png"
          fi

          echo "Applying custom icon from: $ICON_FILE"
          for item in mdpi:48 hdpi:72 xhdpi:96 xxhdpi:144 xxxhdpi:192; do
            NAME=$(echo $item | cut -d: -f1)
            SIZE=$(echo $item | cut -d: -f2)
            mkdir -p android/app/src/main/res/mipmap-$NAME
            convert "$ICON_FILE" -resize ${SIZE}x${SIZE}\! android/app/src/main/res/mipmap-$NAME/ic_launcher.png
            convert "$ICON_FILE" -resize ${SIZE}x${SIZE}\! android/app/src/main/res/mipmap-$NAME/ic_launcher_round.png
          done

          # Adaptive Icon Foregrounds
          convert "$ICON_FILE" -resize 108x108\! android/app/src/main/res/mipmap-mdpi/ic_launcher_foreground.png
          convert "$ICON_FILE" -resize 162x162\! android/app/src/main/res/mipmap-hdpi/ic_launcher_foreground.png
          convert "$ICON_FILE" -resize 216x216\! android/app/src/main/res/mipmap-xhdpi/ic_launcher_foreground.png
          convert "$ICON_FILE" -resize 324x324\! android/app/src/main/res/mipmap-xxhdpi/ic_launcher_foreground.png
          convert "$ICON_FILE" -resize 432x432\! android/app/src/main/res/mipmap-xxxhdpi/ic_launcher_foreground.png

          # Persian Teahouse Turquoise Adaptive Background
          mkdir -p android/app/src/main/res/drawable
          cat << 'EOF' > android/app/src/main/res/drawable/ic_launcher_background.xml
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path
                  android:fillColor="#0D3B3F"
                  android:pathData="M0,0h108v108h-108z"/>
          </vector>
          EOF

      - name: Generate Release Keystore & Configure Signing
        run: |
          keytool -genkeypair -v \
            -keystore android/app/release.keystore \
            -alias chaikhaneh \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass bahman123456 \
            -keypass bahman123456 \
            -dname "CN=Bahman Bamzad, OU=Bahman Games, O=Chaikhaneh Bahman, L=Tehran, ST=Tehran, C=IR"

          python3 - << 'PYEOF'
          path = 'android/app/build.gradle'
          with open(path, 'r', encoding='utf-8') as f:
              content = f.read()

          signing_block = """
              signingConfigs {
                  release {
                      storeFile file('release.keystore')
                      storePassword 'bahman123456'
                      keyAlias 'chaikhaneh'
                      keyPassword 'bahman123456'
                      v1SigningEnabled true
                      v2SigningEnabled true
                  }
              }
          """

          if 'signingConfigs {' not in content:
              content = content.replace('buildTypes {', signing_block + '\n    buildTypes {')

          content = content.replace(
              'buildTypes {\n        release {',
              'buildTypes {\n        release {\n            signingConfig signingConfigs.release'
          )

          with open(path, 'w', encoding='utf-8') as f:
              f.write(content)
          print("Successfully injected release signingConfig into build.gradle")
          PYEOF

      - name: Build Signed Release & Debug APKs
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease assembleDebug --no-daemon -x lint -x test

      - name: Upload Signed Release APK (Recommended for Installation)
        uses: actions/upload-artifact@v4
        with:
          name: Chaikhaneh-Bahman-v1.1-Release-Signed
          path: android/app/build/outputs/apk/release/app-release.apk

      - name: Upload Debug APK (Backup)
        uses: actions/upload-artifact@v4
        with:
          name: Chaikhaneh-Bahman-v1.1-Debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
