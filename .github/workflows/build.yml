name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Extract Project Zip
        run: |
          sudo apt-get install -y unzip
          find . -maxdepth 1 -name "*.zip" -exec unzip -o {} +

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Dependencies & Build Web Project
        run: |
          npm install --legacy-peer-deps
          npm install --save --legacy-peer-deps @capacitor/core@^6.0.0 @capacitor/cli@^6.0.0 @capacitor/android@^6.0.0
          npm run build

      - name: Configure Capacitor & Add Android Platform
        run: |
          cat << 'EOF' > capacitor.config.json
          {
            "appId": "com.bahman.chaikhaneh",
            "appName": "Chaikhaneh Bahman",
            "webDir": "dist"
          }
          EOF
          rm -rf android
          ./node_modules/.bin/cap add android
          ./node_modules/.bin/cap sync android

      - name: Build Android Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon -x lint -x test

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Chaikhaneh-Bahman-v1.0-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
